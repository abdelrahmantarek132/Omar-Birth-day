<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday Omar</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=Space+Grotesk:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0d0d0d;
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  font-family:"Space Grotesk",sans-serif;
}
#rain-container{
  position:fixed;top:0;left:0;
  width:100%;height:100%;
  pointer-events:none;
  overflow:hidden;
  z-index:0;
}
.card{
  position:relative;
  z-index:1;
  background:#0d0d0ddd;
  border:1px solid #ffffff15;
  border-radius:20px;
  padding:24px 20px;
  width:100%;
  max-width:460px;
  backdrop-filter:blur(2px);
}
.emoji-picker{
  display:flex;
  gap:6px;
  flex-wrap:wrap;
  margin-bottom:18px;
  justify-content:center;
}
.ep-btn{
  font-size:22px;
  cursor:pointer;
  padding:6px 8px;
  border-radius:10px;
  border:1.5px solid transparent;
  background:#ffffff10;
  transition:border-color 0.15s, transform 0.1s;
  line-height:1;
  pointer-events:all;
  -webkit-tap-highlight-color:transparent;
}
.ep-btn:active{transform:scale(0.9)}
.ep-btn.active{border-color:#b9ff6a}
.photos{
  display:flex;
  gap:12px;
  justify-content:center;
  margin-bottom:24px;
}
.photo-wrap{
  position:relative;
  width:calc(50% - 6px);
  max-width:160px;
  aspect-ratio:4/5;
  border-radius:14px;
  overflow:hidden;
  border:2px solid #ffffff20;
}
.photo-wrap img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}
.photo-label{
  position:absolute;
  bottom:8px;
  left:50%;
  transform:translateX(-50%);
  background:#000000aa;
  color:#fff;
  font-size:10px;
  font-weight:600;
  padding:3px 10px;
  border-radius:20px;
  white-space:nowrap;
}
.tag{
  display:inline-block;
  font-size:10px;
  font-weight:600;
  letter-spacing:.1em;
  text-transform:uppercase;
  color:#b9ff6a;
  border:1px solid #b9ff6a33;
  padding:4px 12px;
  border-radius:100px;
  margin-bottom:12px;
}
.name{
  font-family:"Syne",sans-serif;
  font-weight:800;
  font-size:clamp(2rem, 10vw, 2.8rem);
  line-height:1.05;
  color:#fff;
  margin-bottom:6px;
}
.age-line{
  font-size:14px;
  color:#ffffff66;
  margin-bottom:16px;
}
.age-line span{color:#b9ff6a;font-weight:700}
.msg{
  font-size:14px;
  line-height:1.75;
  color:#ffffffcc;
  border-left:2px solid #b9ff6a44;
  padding-left:12px;
  margin-bottom:20px;
  direction:rtl;
}
.footer{
  font-size:11px;
  color:#ffffff30;
  letter-spacing:.05em;
  text-align:center;
}
</style>
</head>
<body>

<script>
const emojis = ['🎉'];
let chosen = '🎉';
let drops = [], raf;

const picker = document.getElementById('emojiPicker');
emojis.forEach(e => {
  const b = document.createElement('button');
  b.className = 'ep-btn' + (e === chosen ? ' active' : '');
  b.textContent = e;
  b.onclick = () => {
    chosen = e;
    document.querySelectorAll('.ep-btn').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
    initRain();
  };
  picker.appendChild(b);
});

const container = document.getElementById('rain-container');

function initRain() {
  cancelAnimationFrame(raf);
  container.innerHTML = '';
  drops = [];
  const W = window.innerWidth;
  const H = window.innerHeight;
  const isMobile = W < 600;
  const count = isMobile ? 30 : 50;
  const sz = isMobile ? 22 : 28;
  for (let i = 0; i < count; i++) {
    const el = document.createElement('span');
    el.textContent = chosen;
    el.style.cssText = 'position:absolute;font-size:' + sz + 'px;line-height:1;user-select:none;pointer-events:none';
    container.appendChild(el);
    drops.push({
      el,
      x: Math.random() * W,
      y: Math.random() * H - H,
      vy: 2 + Math.random() * 4,
      vx: (Math.random() - 0.5) * 1.5,
      rot: Math.random() * 360,
      vr: (Math.random() - 0.5) * 3
    });
  }
  tick();
}

function tick() {
  const W = window.innerWidth;
  const H = window.innerHeight;
  drops.forEach(d => {
    d.y += d.vy;
    d.x += d.vx;
    d.rot += d.vr;
    if (d.y > H + 30) { d.y = -40; d.x = Math.random() * W; }
    if (d.x > W + 30) d.x = -30;
    if (d.x < -30) d.x = W + 30;
    d.el.style.top = d.y + 'px';
    d.el.style.left = d.x + 'px';
    d.el.style.transform = 'rotate(' + d.rot + 'deg)';
  });
  raf = requestAnimationFrame(tick);
}

window.addEventListener('resize', initRain);
initRain();
</script>
</body>
</html>
